<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">SalonOps Hub Screen Flow</title>
  <desc id="desc">Main page transitions from login to core modules.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#34d399"/>
    </marker>
    <style>
      .title { fill: #e5e7eb; font: 700 34px 'Noto Sans JP', sans-serif; }
      .sub { fill: #9ca3af; font: 500 18px 'Noto Sans JP', sans-serif; }
      .box { fill: #0f172a; stroke: #34d399; stroke-width: 2; rx: 14; }
      .label { fill: #d1fae5; font: 700 19px 'Noto Sans JP', sans-serif; }
      .path { fill: #cbd5e1; font: 500 14px 'Noto Sans JP', sans-serif; }
      .line { stroke: #34d399; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>

  <text x="58" y="68" class="title">Screen Navigation (MVP)</text>
  <text x="58" y="102" class="sub">認証後にサイドバーから業務モジュールへ移動</text>

  <rect x="70" y="300" width="210" height="92" class="box"/>
  <text x="95" y="338" class="label">Login</text>
  <text x="95" y="362" class="path">/auth</text>

  <rect x="360" y="300" width="240" height="92" class="box"/>
  <text x="385" y="338" class="label">Dashboard</text>
  <text x="385" y="362" class="path">/dashboard</text>

  <rect x="700" y="130" width="250" height="92" class="box"/>
  <text x="725" y="168" class="label">Data Import</text>
  <text x="725" y="192" class="path">/imports</text>

  <rect x="700" y="250" width="250" height="92" class="box"/>
  <text x="725" y="288" class="label">Masters</text>
  <text x="725" y="312" class="path">/masters</text>

  <rect x="700" y="370" width="250" height="92" class="box"/>
  <text x="725" y="408" class="label">Reports</text>
  <text x="725" y="432" class="path">/reports</text>

  <rect x="700" y="490" width="250" height="92" class="box"/>
  <text x="725" y="528" class="label">Audit Logs</text>
  <text x="725" y="552" class="path">/audit</text>

  <rect x="700" y="610" width="250" height="92" class="box"/>
  <text x="725" y="648" class="label">Settings</text>
  <text x="725" y="672" class="path">/settings</text>

  <rect x="1060" y="250" width="250" height="92" class="box"/>
  <text x="1085" y="288" class="label">Items</text>
  <text x="1085" y="312" class="path">/items</text>

  <rect x="1060" y="370" width="250" height="92" class="box"/>
  <text x="1085" y="408" class="label">Item Detail</text>
  <text x="1085" y="432" class="path">/items/[id]</text>

  <path d="M280 346 L 358 346" class="line"/>

  <path d="M600 346 C 650 346, 650 176, 698 176" class="line"/>
  <path d="M600 346 C 650 346, 650 296, 698 296" class="line"/>
  <path d="M600 346 C 650 346, 650 416, 698 416" class="line"/>
  <path d="M600 346 C 650 346, 650 536, 698 536" class="line"/>
  <path d="M600 346 C 650 346, 650 656, 698 656" class="line"/>

  <path d="M950 296 L 1058 296" class="line"/>
  <path d="M1185 342 L 1185 368" class="line"/>
</svg>
